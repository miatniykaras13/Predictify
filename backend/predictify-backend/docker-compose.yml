services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: predictify
      POSTGRES_USER: predictify
      POSTGRES_PASSWORD: predictify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictify -d predictify"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
